<div x-data="{ open: false }" class="no-print fixed bottom-6 left-6 z-50 hidden md:block" @click.outside="open = false">
  <button class="flex items-center gap-2 rounded-full border-2 border-dashed border-lilac bg-lilac-soft px-3 py-1.5 text-xs font-bold text-[#5b45a8] shadow-soft" @click="open = !open" :aria-expanded="open">
    {% icon 'flask-conical' 'size-3.5' %} Сценарий: {% for s in scenarios %}{% if s.key == scenario %}{{ s.title }}{% endif %}{% endfor %}
  </button>
  <div x-show="open" x-cloak x-transition.origin.bottom.left class="card absolute bottom-full mb-2 w-60 p-2">
    <p class="eyebrow px-2.5 py-1.5">Только в dev</p>
    {% for s in scenarios %}
      <a href="{% url 'set_scenario' s.key %}?next={{ request.get_full_path|urlencode }}" class="flex items-center justify-between rounded-xl px-2.5 py-2 text-sm font-semibold hover:bg-sand {% if s.key == scenario %}bg-sand{% endif %}">
        {{ s.title }}{% if s.key == scenario %}{% icon 'check' 'size-4' %}{% endif %}
      </a>
    {% endfor %}
  </div>
</div>
