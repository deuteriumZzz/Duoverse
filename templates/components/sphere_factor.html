<li class="tone-{{ f.tone }} rounded-2xl border border-line bg-paper/80 p-4">
  <div class="flex items-start gap-3">
    <span class="mt-0.5 shrink-0">{% glyph f.universe|universe_glyph 'size-6' %}</span>
    <div class="min-w-0 flex-1">
      <p class="break-words text-sm font-bold leading-snug">{{ f.title }}</p>
      <div class="mt-2 flex flex-wrap gap-1.5">{% include "components/tone_badge.html" with tone=f.tone %}</div>
    </div>
  </div>
  <p class="mt-3 break-words text-sm leading-relaxed text-ink-2">{{ f.text }}</p>
  <a href="{{ rbase }}{{ universe_tab|get_item:f.universe }}/{% if f.ref %}#{{ f.ref }}{% endif %}" class="mono mt-3 block break-words text-xs leading-relaxed text-ink-3 hover:text-ink">{% if f.tech %}{{ f.tech }} · {% endif %}<span class="font-bold">подробнее <span class="inline-block align-[-3px]">{% icon 'arrow-right' 'size-3.5' %}</span></span></a>
</li>
