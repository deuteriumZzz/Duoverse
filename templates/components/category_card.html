{% comment %}c: Category — one row: glyph, title, the verdict, the score; «Почему так» opens on tap.
data-cat-card lights the matching axis of the radar above (app.js).{% endcomment %}
<article class="card tone-{{ c.tone }} overflow-hidden" data-reveal data-cat-card="{{ c.key }}" style="--i: {{ i|default:0 }}" x-data="{ open: false }">
  <button type="button" class="flex w-full items-center gap-3 p-3 pr-4 text-left" @click="open = !open" :aria-expanded="open">
    <span class="anim-{{ c.icon }} grid size-12 shrink-0 place-items-center rounded-2xl t-bg">{% glyph c.icon 'size-9' %}</span>
    <span class="min-w-0 flex-1">
      <b class="block leading-tight">{{ c.title }}<span class="sr-only"> — {{ c.tone|label }}</span></b>
      <span class="mt-0.5 block text-xs leading-snug text-ink-2">{{ c.verdict }}</span>
    </span>
    <span class="shrink-0 font-display text-xl font-extrabold tabular-nums t-ink" data-count="{{ c.score }}">{{ c.score }}</span>
    <span class="shrink-0 text-ink-3 transition" :class="open && 'rotate-180'">{% icon 'chevron-down' 'size-4' %}</span>
  </button>
  <div x-show="open" x-collapse x-cloak>
    <div class="border-t border-line p-4"><p class="eyebrow mb-2">Почему так</p>{% include "components/evidence.html" with items=c.evidence %}</div>
  </div>
</article>
