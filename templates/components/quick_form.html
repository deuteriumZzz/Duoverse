<div class="sticker @container relative p-5 sm:p-7">
  <p class="font-display text-sm font-extrabold">Попробуйте прямо сейчас</p>
  <form class="mt-5 grid gap-4 @sm:grid-cols-2" hx-post="{% url 'quick_result' %}" hx-target="#quick" hx-swap="innerHTML swap:2400ms show:#quick:top" hx-indicator="this" hx-disabled-elt="find button" data-loader="aligning">
    <div class="side-a"><label class="label flex items-center gap-2" for="qa_date"><i class="size-2.5 rounded-full t-fill"></i>Вы родились</label>
      {% include "components/date_field.html" with name="date_a" id="qa_date" value="1996-03-14" required=True %}</div>
    <div class="side-b"><label class="label flex items-center gap-2" for="qb_date"><i class="size-2.5 rounded-full t-fill"></i>Партнёр родился</label>
      {% include "components/date_field.html" with name="date_b" id="qb_date" value="1994-09-02" required=True %}</div>
    <button class="btn btn-primary @sm:col-span-2" data-magnetic>
      <span class="when-idle inline-flex items-center gap-2">{% icon 'sparkles' 'size-4' %}Узнать за 30 секунд</span>
      <span class="when-loading items-center gap-2"><span class="size-4 rounded-full border-2 border-milk/40 border-t-milk spin"></span>Сводим вселенные…</span>
    </button>
  </form>
</div>
<div id="quick" class="mt-8 scroll-mt-24" aria-live="polite"></div>
