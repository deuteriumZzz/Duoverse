<article class="card tone-{{ ins.tone }} p-5 sm:p-6" data-reveal style="--i: {{ i|default:0 }}">
  <div class="flex items-center gap-2">{% include "components/tone_badge.html" with tone=ins.tone %}</div>
  <h3 class="mt-3 text-base font-extrabold">{{ ins.title }}</h3>
  <p class="mt-1.5 text-sm leading-relaxed text-ink-2">{{ ins.text }}</p>
  {% if ins.evidence %}{% include "components/why.html" with items=ins.evidence %}{% endif %}
</article>
