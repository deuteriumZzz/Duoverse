<article class="card side-{{ side }} p-6" data-reveal style="--i: {{ i }}">
  <div class="flex items-center gap-4">
    {% role_emblem role.key side "size-16" %}
    <div>
      <p class="text-xs font-bold uppercase tracking-wider text-ink-3">{{ person.name }}</p>
      <h3 class="text-2xl font-extrabold leading-tight">{{ role.name }}</h3>
      <p class="text-sm t-ink font-semibold">{{ role.verb|capfirst }}</p>
    </div>
  </div>
  <div class="mt-4 flex flex-wrap gap-1.5"><span class="chip bg-sand">{{ elements|get_item:role.element }}</span><span class="chip bg-sand">{{ modes|get_item:role.mode }}</span></div>
  {% include "components/why.html" with items=why %}
</article>
