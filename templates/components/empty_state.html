<div class="flex flex-col items-center px-6 py-12 text-center">
  <div class="relative grid size-20 place-items-center">
    <span class="absolute inset-0 rounded-full {{ bg|default:'bg-sand' }} blob"></span>
    <span class="relative">{% icon icon 'size-8' %}</span>
  </div>
  <h3 class="mt-5 text-lg font-extrabold">{{ title }}</h3>
  <p class="mt-2 max-w-sm text-sm leading-relaxed text-ink-2">{{ text }}</p>
  {% if cta %}<a href="{{ cta_url }}" class="btn btn-primary btn-sm mt-6">{{ cta }}</a>{% endif %}
</div>
