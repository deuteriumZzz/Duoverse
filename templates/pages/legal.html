{% extends "base.html" %}
{% block title %}{{ title }} — Duoverse{% endblock %}
{% block content %}
<article class="mx-auto max-w-3xl px-4 py-14 sm:px-6">
  <nav class="flex flex-wrap gap-2 text-sm">
    <a href="{% url 'privacy' %}" class="chip {% if doc == 'privacy' %}bg-ink text-milk{% endif %}">Политика</a>
    <a href="{% url 'consent' %}" class="chip {% if doc == 'consent' %}bg-ink text-milk{% endif %}">Согласие</a>
    <a href="{% url 'terms' %}" class="chip {% if doc == 'terms' %}bg-ink text-milk{% endif %}">Соглашение и оферта</a>
  </nav>
  <h1 class="mt-8 text-3xl font-extrabold leading-tight sm:text-4xl">{{ title }}</h1>
  <div class="legal mt-8 leading-relaxed text-ink-2">{{ body|safe }}</div>
</article>
{% endblock %}
