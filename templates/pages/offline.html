{% extends "base.html" %}
{% block title %}Нет соединения — Duoverse{% endblock %}
{% block content %}
<div class="mx-auto max-w-md px-4 py-20 text-center sm:px-6">
  <div class="relative mx-auto h-24 w-44">
    <span class="absolute left-0 top-0 size-24 rounded-full bg-a/80 blob"></span>
    <span class="absolute right-0 top-0 size-24 rounded-full border-2 border-dashed border-b bg-b-soft blob"></span>
    <span class="absolute left-1/2 top-1/2 grid size-11 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full border-2 border-ink bg-paper">{% icon 'wifi-off' 'size-5' %}</span>
  </div>
  <h1 class="mt-10 text-3xl font-extrabold">Нет соединения</h1>
  <p class="mt-3 text-ink-2">Последний отчёт сохранён на устройстве — его можно смотреть офлайн. Новый расчёт продолжится, когда сеть вернётся.</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3"><button class="btn btn-primary" onclick="location.reload()">{% icon 'rotate-ccw' 'size-4' %}Попробовать снова</button><a href="{% url 'report' %}" class="btn btn-ghost">Сохранённый отчёт</a></div>
</div>
{% endblock %}
