name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: duoverse, POSTGRES_USER: duoverse, POSTGRES_PASSWORD: duoverse }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U duoverse" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://duoverse:duoverse@localhost:5432/duoverse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: uv venv --python 3.12 && uv pip install -r pyproject.toml --group dev
      - run: npm ci && npm run build
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy apps config
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t duoverse:ci .
      - name: container answers /healthz
        run: |
          docker run -d --name app -p 8000:8000 -e DJANGO_SECRET_KEY=ci -e DJANGO_ALLOWED_HOSTS=localhost \
            -e FIELD_ENCRYPTION_KEY=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())") \
            -e SECURE_SSL_REDIRECT=0 duoverse:ci
          for i in $(seq 30); do curl -fsS localhost:8000/healthz && exit 0; sleep 2; done
          docker logs app; exit 1
