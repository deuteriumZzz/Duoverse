services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: duoverse, POSTGRES_USER: duoverse, POSTGRES_PASSWORD: duoverse }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U duoverse"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    environment: &env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://duoverse:duoverse@db:5432/duoverse
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    volumes: [".:/app", "/app/static/dist"]
  worker:
    build: .
    command: celery -A config worker -l info
    environment: *env
    depends_on: [db, redis]
volumes:
  pgdata:
